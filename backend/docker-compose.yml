services:
  postgres:
    image: postgres:16-alpine
    container_name: stagelink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stagelink
      POSTGRES_USER: stagelink
      POSTGRES_PASSWORD: stagelink
    ports:
      - "5432:5432"
    volumes:
      - stagelink_postgres_data:/var/lib/postgresql/data
  adminer:
    image: adminer:4
    container_name: stagelink-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"
    depends_on:
      - postgres
volumes:
  stagelink_postgres_data:
