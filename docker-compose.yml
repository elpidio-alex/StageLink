services:
  postgres:
    image: postgres:16-alpine
    container_name: stagelink-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: stagelink
      POSTGRES_USER: stagelink
      POSTGRES_PASSWORD: stagelink_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stagelink -d stagelink"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: stagelink-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://stagelink:stagelink_secure_password_2026@postgres:5432/stagelink?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set to a stable random value}
      AUTH_URL: ${AUTH_URL:?AUTH_URL must be set to the public frontend URL}
      AUTH_TRUST_HOST: "true"
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-MOCK}
      PLATFORM_COMMISSION_RATE: ${PLATFORM_COMMISSION_RATE:-8}
      AUTO_RELEASE_DAYS: ${AUTO_RELEASE_DAYS:-7}
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/backend/public/uploads
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:3001/api/health | grep -q 'ok' || exit 1",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BACKEND_URL: http://backend:3001
    container_name: stagelink-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:3001
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:-stagelink_production_jwt_secret_key_change_me_2026}
      PORT: 3000
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  backend_uploads:
